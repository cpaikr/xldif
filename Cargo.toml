[workspace]
members = ["crates/xldif", "crates/xldif-cli", "crates/xldif-fixtures"]
default-members = ["crates/xldif", "crates/xldif-cli", "crates/xldif-fixtures"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
license = "Elastic-2.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
quick-xml = "0.42"
rust_xlsxwriter = "0.102"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
xldif = { path = "crates/xldif" }
xldif-fixtures = { path = "crates/xldif-fixtures" }
zip = { version = "9.5", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
similar_names = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
