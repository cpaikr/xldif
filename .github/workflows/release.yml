name: Release

# Publishing is deliberate: a maintainer pushes a `v*` tag whose version
# matches Cargo.toml. Ordinary work never pushes tags.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.actor == 'sjunepark'
    # Windows only: xldif is used beside Excel. Other platforms build from
    # source, and CI still checks Linux.
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Rust 1.88
        shell: bash
        run: rustup toolchain install 1.88.0 --profile minimal --target "$TARGET"
      - name: Tag matches the workspace version
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "$TARGET" -p xldif-cli
      - name: Smoke test
        shell: bash
        run: ./target/$TARGET/release/xldif.exe --version
      - name: Package
        shell: bash
        run: |
          name=xldif-${GITHUB_REF_NAME}-${TARGET}
          mkdir "$name"
          cp "target/$TARGET/release/xldif.exe" README.md LICENSE.md "$name"/
          7z a "$name.zip" "$name" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-pc-windows-msvc
          path: xldif-*.zip

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Only this job writes: it creates the release.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes xldif-*.zip
